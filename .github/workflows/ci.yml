name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  schedule:
    # Weekly security audit on Sundays at midnight
    - cron: "0 0 * * 0"
  # The release workflow calls this workflow as its gate with `full: true`.
  workflow_call:
    inputs:
      full:
        description: "Run every job and require each one to succeed"
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  # Don't use RUSTFLAGS=-D warnings, use workspace lints configuration instead
  RUSTUP_MAX_RETRIES: 10

# Cancel previous runs on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether the diff touches anything beyond documentation so the full
  # check chain can be skipped on docs-only changes. Workflow file changes
  # always force the full chain to run, since they could be the thing that's
  # broken. Scheduled runs (weekly security audit) always run everything too,
  # since there's no meaningful diff to compare against. A `full` call (the
  # release gate) runs everything and skips the filter.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run-checks: ${{ inputs.full || github.event_name == 'schedule' || steps.filter.outputs.code == 'true' || steps.filter.outputs.workflows == 'true' }}
      run-publish: ${{ inputs.full || steps.filter.outputs.manifests == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check changed paths
        if: github.event_name != 'schedule' && !inputs.full
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!specs/**'
              - '!docs/**'
              - '!README*'
              - '!CHANGELOG*'
              - '!CONTRIBUTING*'
              - '!LICENSE*'
              - '!SECURITY*'
            workflows:
              - '.github/workflows/**'
            manifests:
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/release.yml'
              - 'LICENSE*'
              - 'crates/*/LICENSE-*'

  # Quick checks first - fail fast strategy
  check:
    name: Check
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    if: always() && needs.changes.outputs.run-checks == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy

      - name: Install Rust nightly (for rustfmt)
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "check"
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Check formatting (nightly)
        run: cargo +nightly fmt --all -- --check

      - name: Install cargo-sort
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-sort

      - name: Check Cargo.toml dependency order
        run: cargo sort --check --workspace --order package,lints,workspace,lib,bin,features,dependencies,build-dependencies,dev-dependencies

      - name: Clippy (all targets, all features)
        run: cargo +stable clippy --all-targets --all-features --workspace

      - name: Check documentation
        run: cargo +stable doc --no-deps --all-features --workspace
        env:
          RUSTDOCFLAGS: "-D warnings"

  # Security audit using cargo-deny
  security:
    name: Security Audit
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    if: always() && needs.changes.outputs.run-checks == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run cargo-deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          log-level: warn
          command: check
          arguments: --all-features
          command-arguments: advisories licenses bans sources

  # Cross-platform build matrix, run in parallel with `test` (not sequentially
  # before it): nextest builds whatever it needs on its own, so this job only
  # verifies that all targets/features compile across the full OS/toolchain
  # matrix without blocking the test job.
  build:
    name: Build (${{ matrix.os }}, Rust ${{ matrix.rust }})
    needs: [changes, check]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    if: needs.changes.outputs.run-checks == 'true' && needs.check.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          # Test on beta channel on Linux only
          - os: ubuntu-latest
            rust: beta

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "build-${{ matrix.os }}-${{ matrix.rust }}"
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Build (all targets, all features)
        run: cargo build --all-targets --all-features --workspace

  # Cross-platform tests with matrix
  test:
    name: Test (${{ matrix.os }}, Rust ${{ matrix.rust }})
    needs: [changes, check]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    if: needs.changes.outputs.run-checks == 'true' && needs.check.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          # Test on beta channel on Linux only
          - os: ubuntu-latest
            rust: beta

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "test-${{ matrix.os }}-${{ matrix.rust }}"
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Install nextest
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: nextest

      # mcp-execution-codegen's test suite compiles and executes generated TypeScript under
      # `tsc`/`node` (e.g. the #201 runtime-bridge regression tests) to catch TypeScript-level
      # regressions that a Rust-only check can't see. Those tests hard-fail (rather than
      # silently skip) when the `CI` env var is set, so this toolchain must be present here.
      # 22.18.0 is the supported Node.js floor, so every leg runs the suite on it.
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.18.0"

      - name: Install TypeScript
        run: npm install -g typescript

      # Linux is linted by the `check` job; the other platforms compile cfg-gated code
      # that clippy there never sees.
      - name: Clippy (macOS and Windows)
        if: matrix.os != 'ubuntu-latest' && matrix.rust == 'stable'
        run: cargo +stable clippy --all-targets --all-features --workspace

      - name: Run tests (nextest)
        run: cargo nextest run --all-features --workspace --no-fail-fast

      - name: Run doctests
        run: cargo test --doc --all-features --workspace

  # Code coverage (Linux only for speed)
  coverage:
    name: Code Coverage
    needs: [changes, check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write  # For uploading artifacts
    if: needs.changes.outputs.run-checks == 'true' && needs.check.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Install llvm-cov
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov

      - name: Install nextest
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: nextest

      # See the `test` job for why this toolchain is required: mcp-execution-codegen's
      # TypeScript-executing regression tests hard-fail under `CI` rather than skip.
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.18.0"

      - name: Install TypeScript
        run: npm install -g typescript

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "coverage"
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Generate coverage (nextest)
        run: |
          cargo llvm-cov --all-features --workspace --lcov \
            --output-path lcov.info nextest

      - name: Upload to codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
          verbose: true
          flags: mcp-core,mcp-introspector,mcp-codegen,mcp-files,mcp-skill,mcp-server,mcp-cli
          name: codecov-umbrella

      - name: Archive coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 30

  # MSRV check (Minimum Supported Rust Version)
  msrv:
    name: Check MSRV (1.98)
    needs: [changes, check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    if: needs.changes.outputs.run-checks == 'true' && needs.check.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.98"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "msrv"

      - name: Check with MSRV
        run: cargo check --all-features --workspace

  # Benchmarks (build only, don't run in CI)
  benchmark:
    name: Benchmark Build
    needs: [changes, check]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    if: needs.changes.outputs.run-checks == 'true' && needs.check.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "bench"

      - name: Build benchmarks (no run)
        run: cargo bench --no-run --profile bench-fast --workspace

  # Packaging gate: every crate must package and compile from its own tarball,
  # and the workspace version needs a changelog section for the release notes.
  # Runs for the release gate and for diffs that touch manifests, the lockfile,
  # license files or the release workflow.
  publish-dry-run:
    name: Publish Dry Run
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    if: needs.changes.outputs.run-publish == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "publish"
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Check the changelog section of the workspace version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          .github/scripts/changelog-section.sh "$version" > /dev/null

      - name: Check every crate packages both license files
        run: |
          for name in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name'); do
            count="$(cargo package -p "$name" --list --locked | grep -c '^LICENSE-\(MIT\|APACHE\)$' || true)"
            if [[ "$count" != 2 ]]; then
              echo "::error::$name packages $count license files, expected LICENSE-MIT and LICENSE-APACHE"
              exit 1
            fi
          done

      # An already published version only warns, and unpublished siblings are
      # resolved from the local tarballs, so a re-run after a partial publish passes.
      - name: Publish dry run (workspace)
        run: cargo publish --workspace --dry-run --locked

  # Semver compatibility against the last published version. The step is non-blocking
  # (the job itself always reports success): before 1.0 a breaking change is allowed
  # against 0.x, so this only surfaces tool or baseline failures until the 1.0.0
  # baseline exists, when `continue-on-error` is removed.
  semver:
    name: Semver Check
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    if: needs.changes.outputs.run-checks == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run cargo-semver-checks
        continue-on-error: true
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9

  # Newest Node.js, Bun and Deno: the alternative-runtime tests must run here, so
  # MCP_EXECUTION_REQUIRE_ALT_RUNTIMES (the name defined by `REQUIRE_ALT_RUNTIMES_ENV` in
  # crates/mcp-cli/tests/common/mod.rs) turns a missing runtime into a failure.
  node-latest:
    name: Latest Runtimes (Node.js, Bun, Deno)
    needs: [changes, check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    if: needs.changes.outputs.run-checks == 'true' && needs.check.result == 'success'
    env:
      MCP_EXECUTION_REQUIRE_ALT_RUNTIMES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "node-latest"
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Install nextest
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: nextest

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # The codegen and CLI tests hard-fail under CI when `tsc` is missing.
      - name: Install TypeScript
        run: npm install -g typescript

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5

      - name: Run CLI tests (nextest)
        run: cargo nextest run -p mcp-execution-cli --all-features --no-fail-fast

      # `bash` enables pipefail, so a filter that matches no test fails the step
      # instead of being masked by `tee`.
      - name: Check the alternative-runtime tests ran instead of skipping
        shell: bash
        run: |
          cargo nextest run -p mcp-execution-cli --all-features \
            -E 'binary(acceptance_runtime_compat)' --no-capture 2>&1 | tee compat.log
          if grep -q 'alt-runtime skipped' compat.log; then
            echo "::error::alternative-runtime tests skipped although MCP_EXECUTION_REQUIRE_ALT_RUNTIMES is set"
            exit 1
          fi

  # Release build check (master only — skip on PRs and other branches)
  release:
    name: Release Build
    needs: [changes, test]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    if: github.ref == 'refs/heads/master' && needs.changes.outputs.run-checks == 'true' && needs.test.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "release"

      - name: Build release
        run: cargo build --release --all-features --workspace

      - name: Check binary sizes
        run: |
          echo "Binary sizes:"
          ls -lh target/release/ | grep -E "(mcp-execution-cli|mcp-examples)" || true
          echo ""
          echo "Target directory size:"
          du -sh target/release/

  # All checks passed
  ci-success:
    name: CI Success
    needs: [changes, check, security, build, test, coverage, msrv, benchmark, publish-dry-run, semver, node-latest]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check all jobs
        # `skipped` is an acceptable outcome on push and pull requests: on docs-only
        # diffs the gated jobs skip themselves via the `changes` job's outputs rather
        # than failing, and this status check must still report success rather than
        # staying red or pending. A `full` call (the release gate) never skips, so
        # there every job must be `success`.
        env:
          FULL: ${{ inputs.full }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [[ "$result" == "success" ]]; then
              continue
            fi
            if [[ "$result" == "skipped" && "$FULL" != "true" ]]; then
              continue
            fi
            echo "A required job reported '$result' (full run: ${FULL:-false})"
            exit 1
          done
          echo "All required jobs passed"
