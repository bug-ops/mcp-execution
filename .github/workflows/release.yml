name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify Tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against the workspace
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          mismatches="$(cargo metadata --no-deps --format-version 1 | jq -r --arg v "$version" '
            (.packages | map(.name)) as $members
            | .packages[]
            | (select(.version != $v) | "\(.name) is version \(.version)"),
              (.name as $n | .dependencies[]
                | select(.kind != "dev")
                | select(.name as $d | $members | index($d))
                | select(.req != "^" + $v)
                | "\($n) depends on \(.name) \(.req)")
          ')"
          if [[ -n "$mismatches" ]]; then
            echo "::error::tag $TAG does not match the workspace versions"
            echo "$mismatches"
            exit 1
          fi

      - name: Check the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          .github/scripts/changelog-section.sh "${TAG#v}" > /dev/null
          if .github/scripts/changelog-section.sh Unreleased > /dev/null 2>&1; then
            echo "::error::CHANGELOG.md [Unreleased] is not empty"
            exit 1
          fi

  # The full CI run (every job must succeed) gates the release.
  gate:
    name: CI Gate
    needs: [verify]
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      full: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build Release (${{ matrix.target }})
    needs: [verify, gate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cli_artifact: mcp-execution-cli
            server_artifact: mcp-execution
            asset_suffix: linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cli_artifact: mcp-execution-cli
            server_artifact: mcp-execution
            asset_suffix: linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            cli_artifact: mcp-execution-cli
            server_artifact: mcp-execution
            asset_suffix: macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            cli_artifact: mcp-execution-cli
            server_artifact: mcp-execution
            asset_suffix: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cli_artifact: mcp-execution-cli.exe
            server_artifact: mcp-execution.exe
            asset_suffix: windows-amd64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            cli_artifact: mcp-execution-cli.exe
            server_artifact: mcp-execution.exe
            asset_suffix: windows-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Install cross-compilation tools for ARM Linux
      - name: Install cross-compilation tools (ARM Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release (CLI)
        run: cargo build --release --target ${{ matrix.target }} --package mcp-execution-cli
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Build release (MCP Server)
        run: cargo build --release --target ${{ matrix.target }} --package mcp-execution-server
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Strip binaries (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            aarch64-linux-gnu-strip target/${{ matrix.target }}/release/${{ matrix.cli_artifact }}
            aarch64-linux-gnu-strip target/${{ matrix.target }}/release/${{ matrix.server_artifact }}
          else
            strip target/${{ matrix.target }}/release/${{ matrix.cli_artifact }}
            strip target/${{ matrix.target }}/release/${{ matrix.server_artifact }}
          fi

      - name: Package binaries (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../mcp-execution-cli-${{ matrix.asset_suffix }}.tar.gz ${{ matrix.cli_artifact }}
          tar czf ../../../mcp-execution-${{ matrix.asset_suffix }}.tar.gz ${{ matrix.server_artifact }}

      - name: Package binaries (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../mcp-execution-cli-${{ matrix.asset_suffix }}.zip ${{ matrix.cli_artifact }}
          7z a ../../../mcp-execution-${{ matrix.asset_suffix }}.zip ${{ matrix.server_artifact }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-execution-cli-${{ matrix.asset_suffix }}
          path: |
            mcp-execution-cli-${{ matrix.asset_suffix }}.tar.gz
            mcp-execution-cli-${{ matrix.asset_suffix }}.zip
          retention-days: 10

      - name: Upload MCP Server artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-execution-${{ matrix.asset_suffix }}
          path: |
            mcp-execution-${{ matrix.asset_suffix }}.tar.gz
            mcp-execution-${{ matrix.asset_suffix }}.zip
          retention-days: 10

  publish-crates:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    # Approve within 10 days (artifact retention), or the GitHub release fails after publishing.
    environment: release
    permissions:
      id-token: write # Required for trusted publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      # Trusted Publishing (OIDC) - no manual token needed after initial setup
      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: crates-io-auth

      - name: Publish crates
        uses: katyo/publish-crates@02cc2f1ad653fb25c7d1ff9eb590a8a50d06186b # v2
        with:
          registry-token: ${{ steps.crates-io-auth.outputs.token }}
          ignore-unpublished-changes: true
          publish-delay: 5000

  release:
    name: Create Release
    needs: [build, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # The gate's CI run uploads artifacts too (coverage); only binaries are release assets.
          pattern: mcp-execution-*
          path: artifacts

      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: .github/scripts/changelog-section.sh "${TAG#v}" > release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: artifacts/**/*
          body_path: release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
