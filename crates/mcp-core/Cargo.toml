[package]
name = "mcp-execution-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core types, traits, and error handling for MCP execution"
keywords = ["mcp", "execution", "core", "types"]
categories = ["development-tools"]

[lints]
workspace = true

[dependencies]
dirs = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

# Only `path.rs`'s Windows/macOS-specific `#[cfg(any(windows, target_os = "macos"))]` comparison
# helpers use this; scoped here so Linux builds don't compile/link its Unicode tables for nothing.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
unicode-normalization = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
