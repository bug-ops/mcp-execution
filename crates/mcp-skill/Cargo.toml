[package]
name = "mcp-execution-skill"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "SKILL.md generation for Claude Code integration with MCP tools"
keywords = ["mcp", "skill", "claude-code", "codegen"]
categories = ["development-tools"]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
handlebars = { workspace = true }
mcp-execution-core = { workspace = true }
regex = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing = { workspace = true }

[dev-dependencies]
mcp-execution-codegen = { workspace = true }
mcp-execution-introspector = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
