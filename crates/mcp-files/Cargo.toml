[package]
name = "mcp-execution-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Virtual filesystem for MCP code generation and organization"
keywords = ["mcp", "filesystem", "vfs", "codegen"]
categories = ["development-tools", "filesystem"]

[lints]
workspace = true

[features]
parallel = ["dep:rayon"]

[dependencies]
dirs.workspace = true
mcp-execution-codegen.workspace = true
mcp-execution-core.workspace = true
rayon = { workspace = true, optional = true }
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
dhat.workspace = true
mcp-execution-introspector.workspace = true
serde_json.workspace = true

[[bench]]
name = "vfs_benchmarks"
harness = false

[[bench]]
name = "filesystem_export"
harness = false
