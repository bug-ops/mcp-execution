[package]
name = "mcp-execution-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI that generates a typed TypeScript SDK from MCP servers"
keywords = ["mcp", "cli", "codegen", "typescript"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[lints]
workspace = true

[[bin]]
name = "mcp-execution-cli"
path = "src/main.rs"

[[bin]]
# Test fixture MCP server (stdio, or `--http 127.0.0.1:0`) with a fixed tool set, spawned by the
# acceptance tests. Not part of the public API; only built with `--features test-fixtures`
# (implied by `--all-features`, which is how CI runs tests).
name = "fixture-tools-mcp-server"
path = "tests/fixtures/tools_mcp_server.rs"
test = false
doc = false
required-features = ["test-fixtures"]

[features]
# Enables the server-side rmcp features and the HTTP stack the fixture server needs, without
# pulling them into the default build of this client-side crate.
test-fixtures = [
    "dep:axum",
    "dep:rmcp",
    "dep:tokio-util",
    "rmcp/server",
    "rmcp/transport-io",
    "rmcp/transport-streamable-http-server",
]

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
nix = { workspace = true, features = ["signal"] }
rustix = { workspace = true, features = ["process", "termios"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, optional = true }
clap = { workspace = true, features = ["derive", "color"] }
clap_complete.workspace = true
colored = { workspace = true }
dirs = { workspace = true }
futures-util = { workspace = true }
mcp-execution-codegen = { workspace = true }
mcp-execution-core = { workspace = true, features = ["tracing-filter"] }
mcp-execution-files = { workspace = true }
mcp-execution-introspector = { workspace = true }
mcp-execution-skill = { workspace = true }
rmcp = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "sync",
    "time",
    "process",
    "io-std",
    "io-util",
    "net",
    "signal",
] }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
which = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
