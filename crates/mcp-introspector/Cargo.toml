[package]
name = "mcp-execution-introspector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MCP server introspection and tool discovery using rmcp SDK"
keywords = ["mcp", "introspection", "rmcp", "tools"]
categories = ["development-tools"]

[lints]
workspace = true

[[bin]]
# Test fixture spawned by tests/timeout_test.rs to simulate a hung MCP server.
# Not part of the public crate API; only built with `--features test-fixtures`
# (implied by `--all-features`, which is how CI runs tests).
name = "fixture-slow-mcp-server"
path = "tests/fixtures/slow_mcp_server.rs"
test = false
doc = false
required-features = ["test-fixtures"]

[features]
# Enables the server-side rmcp features needed by the slow-server (stdio) and
# HTTP fixture servers used in tests, without pulling them into the default
# build of this (client-only) crate.
test-fixtures = [
    "rmcp/server",
    "rmcp/transport-io",
    "rmcp/transport-streamable-http-server",
]

[dependencies]
futures-util.workspace = true
http.workspace = true
mcp-execution-core.workspace = true
rmcp = { workspace = true, features = [
    "client",
    # Selects reqwest's rustls TLS backend for https:// URLs; the
    # `transport-streamable-http-client-reqwest` feature alone only pulls in
    # the `reqwest` dependency without a TLS backend.
    "reqwest",
    "transport-streamable-http-client-reqwest",
    # Explicit rather than relying on the implicit `default -> server` path: this
    # is a client-only crate, and `JsonRpcMessageCodec` (used to bound the stdio
    # discovery read path, see `bounded_response_stream`) lives behind this
    # feature.
    "transport-async-rw",
] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "time"] }
tokio-util = { workspace = true, features = ["codec"] }
tracing.workspace = true

[dev-dependencies]
axum.workspace = true
criterion = { workspace = true, features = ["async_tokio"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util", "macros", "net"] }
